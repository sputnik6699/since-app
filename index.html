<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>События</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #efeff4);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
  --text: var(--tg-theme-text-color, #000);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --link: var(--tg-theme-link-color, #2481cc);
  --sep: var(--tg-theme-section-separator-color, rgba(0, 0, 0, .12));
  --red: var(--tg-theme-destructive-text-color, #e53935);
  --green: #31a24c;
  --btn: var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #fff);
}
* { box-sizing: border-box; margin: 0; }
/* Один шрифт и один размер — на 1px мельче интерфейса Telegram (17 на iOS, 16 на Android) */
html, body { background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, system-ui, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
body.ios { font-size: 16px; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; outline: 0; padding: 0; }
#app { padding: 4px 0 32px; }
.h { display: flex; justify-content: space-between; color: var(--hint); padding: 12px 28px 4px; }
.c { background: var(--card); margin: 0 12px; border-radius: 10px; overflow: hidden; }
.gap { margin-top: 16px; }
.r { display: flex; align-items: center; gap: 16px; min-height: 34px; padding: 6px 16px; position: relative; }
.r + .r::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.f { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n { font-variant-numeric: tabular-nums; }
.neg, .danger { color: var(--red); }
.pos { color: var(--green); }
.hint { color: var(--hint); }
.paused { color: var(--hint); opacity: .5; }
.link { color: var(--link); }
.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.r.tap:active { background: var(--sep); }
input, select { flex: 1; min-width: 0; width: 100%; }
input::placeholder { color: var(--hint); }
/* Родное поле даты прозрачно лежит поверх строки: видно нашу подпись, а по тапу открывается системный календарь */
.over { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 2px; }
.chip { padding: 3px 10px; border-radius: 16px; background: var(--bg); }
.chip.on { background: var(--btn); color: var(--btn-text); }
.demo { display: block; width: calc(100% - 24px); margin: 24px 12px 0; padding: 12px; border-radius: 10px; background: var(--btn); color: var(--btn-text); }
.msg { padding: 48px 16px; text-align: center; color: var(--hint); }
</style>
</head>
<body>
<div id="app"><div class="msg">Загрузка…</div></div>
<script>
// Адрес веб-приложения Apps Script (тот же, что у вебхука бота)
const API = 'https://script.google.com/macros/s/AKfycbxeE5nvJhyfiQ1V8K7u-5njU5gEhv3Vwv4aHCvz-UU08zsVlsLVPJHenN95wRTgoLU/exec';
const TERMS = ['29', '30', '1m', '3m', '6m', '12m'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// Статусы события — те же слова, что в колонке A таблицы
const STATUSES = [
  { key: 'active', emoji: '🍏', title: 'старт, срок, окончание' },
  { key: 'pause',  emoji: '🍋', title: 'пауза, даты сохраняются' },
  { key: 'count',  emoji: '🔢', title: 'только дни от старта' },
  { key: 'till',   emoji: '⏳', title: 'только дата в будущем' }
];
const STATUS_BY_KEY = {};
STATUSES.forEach(s => STATUS_BY_KEY[s.key] = s);
const DEFAULT_STATUS = 'active';

const tg = window.Telegram && Telegram.WebApp;
// Открыто не из Telegram — показываем пример данных, ничего не сохраняем
const DEMO = !tg || !tg.initData;
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
let groups = [];
let mainFn = null;
let backFn = null;

if (tg) {
  tg.ready();
  tg.expand();
  if (tg.platform === 'ios' || tg.platform === 'macos') document.body.classList.add('ios');
  if (!DEMO) {
    tg.MainButton.onClick(() => mainFn && mainFn());
    tg.BackButton.onClick(() => backFn && backFn());
  }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// ymd = 'yyyyMMdd' (как в скрипте), iso = 'yyyy-mm-dd' (как в поле даты)
const ymdToIso = y => y ? `${y.slice(0, 4)}-${y.slice(4, 6)}-${y.slice(6, 8)}` : '';
const isoToYmd = s => s ? s.replace(/-/g, '') : '';
// Как в таблице: 2026-Oct-07
const prettyIso = s => s ? `${s.slice(0, 4)}-${MONTHS[+s.slice(5, 7) - 1]}-${s.slice(8, 10)}` : '';
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const statusOf = e => e.status || '';

function say(text) { DEMO ? alert(text) : tg.showAlert(text); }
function ask(text, cb) { DEMO ? cb(confirm(text)) : tg.showConfirm(text, cb); }

async function api(action, data) {
  if (DEMO) return demoApi(action);
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg.initData, action }, data)) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Ошибка');
  return json;
}

// Кнопки снизу и «назад» — родные кнопки Telegram; в демо — обычные
function screen(html, opts = {}) {
  app.innerHTML = (DEMO && opts.back ? '<div class="r tap link" id="dback">‹ Назад</div>' : '') + html +
    (DEMO && opts.main ? `<button class="demo tap" id="dmain">${opts.main[0]}</button>` : '');
  mainFn = opts.main ? opts.main[1] : null;
  backFn = opts.back || null;
  if (DEMO) {
    if (opts.main) $('dmain').onclick = mainFn;
    if (opts.back) $('dback').onclick = opts.back;
  } else {
    opts.main ? tg.MainButton.setText(opts.main[0]).show() : tg.MainButton.hide();
    opts.back ? tg.BackButton.show() : tg.BackButton.hide();
  }
  window.scrollTo(0, 0);
}

// Изменение в таблице; в ответ всегда приходит свежий список
async function run(action, data) {
  if (!DEMO) tg.MainButton.showProgress();
  try {
    groups = (await api(action, data)).groups;
    showList();
  } catch (err) {
    say(err.message);
  } finally {
    if (!DEMO) tg.MainButton.hideProgress();
  }
}

async function load() {
  try {
    groups = (await api('list')).groups;
    showList();
  } catch (err) {
    app.innerHTML = `<div class="msg">${esc(err.message)}</div>`;
  }
}


// ====== Список ======
const isPaused = e => statusOf(e) === 'pause';

// Пауза и события без дней — в конце группы, остальные по возрастанию дней
function byDays(a, b) {
  const last = e => isPaused(e) || e.days === null;
  if (last(a) || last(b)) return last(a) - last(b);
  return a.days - b.days;
}

// Слева от названия — только там, где статус неочевиден из самих дней
function mark(e) {
  const st = statusOf(e);
  if (st === 'count') return '🔢 ';
  if (st === 'till') return '⏳ ';
  if (!st) return '• ';
  return '';
}

function daysHtml(e) {
  if (isPaused(e)) return '<span class="paused">пауза</span>';
  if (e.days === null) return statusOf(e) ? '' : '<span class="hint">без статуса</span>';
  return `<span class="n ${e.days < 0 ? 'neg' : 'pos'}">${e.days}</span>`;
}

function showList() {
  let html = '';
  groups.forEach((g, gi) => {
    html += `<div class="h"><span>${esc(g.name || 'Без группы')}</span>` +
      (g.row ? `<span class="link tap" data-g="${gi}">Изменить</span>` : '') + '</div><div class="c">';
    g.items.sort(byDays);
    g.items.forEach((e, ei) => {
      html += `<div class="r tap" data-g="${gi}" data-e="${ei}"><span class="f${isPaused(e) ? ' paused' : ''}">${mark(e)}${esc(e.name)}</span>${daysHtml(e)}</div>`;
    });
    if (!g.items.length) html += '<div class="r hint">Нет событий</div>';
    html += '</div>';
  });
  html += '<div class="c gap"><div class="r tap link" id="ng">Новая группа</div></div>';
  screen(html);

  app.querySelectorAll('[data-g]').forEach(el => el.onclick = () => {
    const g = groups[el.dataset.g];
    el.dataset.e !== undefined ? showEvent(g.items[el.dataset.e], g) : showGroup(g);
  });
  $('ng').onclick = () => showGroup(null);
}


// ====== Событие (e = null — новое) ======
function showEvent(e, g) {
  const isNew = !e;
  // Черновик: что сейчас на экране
  const d = {
    row: isNew ? null : e.row,
    name: isNew ? '' : e.name,
    status: isNew ? DEFAULT_STATUS : (statusOf(e) || DEFAULT_STATUS),
    start: isNew ? '' : (e.start || ''),
    end: isNew ? '' : (e.endYmd || ''),
    endText: isNew ? '' : (e.end || ''),
    endFormula: isNew ? false : !!e.endFormula, // у ⏳till в СТОП бывает формула (ближайшая Зп)
    term: isNew ? '' : (e.term || ''),
    days: isNew ? null : e.days
  };
  // Исходные значения — нужны для «Пауза» / «Включить»: они не должны терять несохранённые правки дат
  const saved = { start: d.start, end: d.end, term: d.term };

  const groupOptions = groups.filter(x => x.row)
    .map(x => `<option value="${x.row}"${x.row === g.row ? ' selected' : ''}>${esc(x.name)}</option>`).join('');

  function statusChipsHtml() {
    return `<div class="h">Статус<span class="hint" id="stHint">${esc(STATUS_BY_KEY[d.status].title)}</span></div>
      <div class="c"><div class="chips" id="schips">${STATUSES.map(s =>
        `<span class="chip tap${s.key === d.status ? ' on' : ''}" data-s="${s.key}">${s.emoji} ${s.key}</span>`).join('')}</div></div>`;
  }

  function totalsHtml() {
    if (isNew) return '';
    // У ⏳till «окончание» — это и есть та самая будущая дата, второй раз не показываем
    const endLine = d.endText && d.status !== 'till'
      ? `<div class="r"><span class="f hint">Окончание</span><span class="n">${esc(d.endText)}${d.endFormula ? ' <span class="hint">формула</span>' : ''}</span></div>`
      : '';
    return `<div class="c gap">${endLine}
      <div class="r"><span class="f hint">Дней</span><span class="n ${d.days === null ? '' : (d.days < 0 ? 'neg' : 'pos')}">${d.days === null ? '—' : d.days}</span></div>
    </div>`;
  }

  // Поля зависят от статуса: у count нет срока, у till нет старта
  function fieldsHtml() {
    if (d.status === 'till') {
      const dateRow = d.endFormula
        ? `<div class="r"><span class="f">${esc(d.endText || '—')}</span><span class="hint">формула</span></div>`
        : `<div class="r tap"><span class="f" id="enText"></span><input id="en" class="over" type="date" value="${ymdToIso(d.end)}"></div>
           <div class="r"><span class="link tap" id="etoday">Сегодня</span><span class="link tap" id="etomorrow">Завтра</span></div>`;
      return `<div class="h">Дата в будущем</div><div class="c">${dateRow}</div>` + totalsHtml();
    }

    const startBlock = `<div class="h">Дата начала</div>
      <div class="c">
        <div class="r tap"><span class="f" id="stText"></span><input id="st" class="over" type="date" value="${ymdToIso(d.start)}"></div>
        <div class="r"><span class="link tap" id="today">Сегодня</span><span class="link tap" id="yest">Вчера</span></div>
      </div>`;

    const termBlock = d.status === 'count' ? '' : `<div class="h">Срок</div>
      <div class="c"><div class="chips" id="chips"></div><div class="r"><input id="tm" value="${esc(d.term)}" placeholder="Без срока"></div></div>`;

    return startBlock + termBlock + totalsHtml();
  }

  function actionsHtml() {
    if (isNew) return '';
    const resume = d.status === 'pause'
      ? '<div class="r tap link" id="resume">Вернуть в работу</div>'
      : '<div class="r tap link" id="pause">Поставить на паузу</div>';
    return `<div class="c gap">${resume}<div class="r tap danger" id="del">Удалить событие</div></div>`;
  }

  function render() {
    screen(`
      <div class="h">Название</div>
      <div class="c"><div class="r"><input id="nm" value="${esc(d.name)}" placeholder="Netflix"></div></div>
      <div class="h">Группа</div>
      <div class="c"><div class="r"><select id="gr">${groupOptions}</select></div></div>
      ${statusChipsHtml()}
      ${fieldsHtml()}
      ${actionsHtml()}
    `, { main: [isNew ? 'Добавить' : 'Сохранить', save], back: showList });

    $('nm').oninput = () => { d.name = $('nm').value; };
    $('schips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
      sync();
      d.status = c.dataset.s;
      render();
    });

    // Дата начала
    const st = $('st');
    if (st) {
      const drawStart = () => {
        $('stText').textContent = prettyIso(st.value) || 'Не задана';
        $('stText').className = 'f' + (st.value ? '' : ' hint');
      };
      drawStart();
      st.onchange = st.oninput = drawStart;
      // На компьютере тап по полю календарь сам не открывает
      st.onclick = () => { try { st.showPicker(); } catch (err) {} };
      $('today').onclick = () => { st.value = isoOf(new Date()); drawStart(); };
      $('yest').onclick = () => { const x = new Date(); x.setDate(x.getDate() - 1); st.value = isoOf(x); drawStart(); };
    }

    // Дата в будущем (⏳till без формулы)
    const en = $('en');
    if (en) {
      const drawEnd = () => {
        $('enText').textContent = prettyIso(en.value) || 'Не задана';
        $('enText').className = 'f' + (en.value ? '' : ' hint');
      };
      drawEnd();
      en.onchange = en.oninput = drawEnd;
      en.onclick = () => { try { en.showPicker(); } catch (err) {} };
      $('etoday').onclick = () => { en.value = isoOf(new Date()); drawEnd(); };
      $('etomorrow').onclick = () => { const x = new Date(); x.setDate(x.getDate() + 1); en.value = isoOf(x); drawEnd(); };
    }

    // Срок
    const tm = $('tm');
    if (tm) {
      const drawChips = () => {
        $('chips').innerHTML = TERMS.map(t => `<span class="chip tap${tm.value.trim() === t ? ' on' : ''}" data-t="${t}">${t}</span>`).join('');
        $('chips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
          tm.value = tm.value.trim() === c.dataset.t ? '' : c.dataset.t;
          drawChips();
        });
      };
      drawChips();
      tm.oninput = () => { d.term = tm.value; drawChips(); };
    }

    if ($('del')) $('del').onclick = () => ask(`Удалить «${d.name}»?`, ok => ok && run('deleteEvent', { row: d.row, name: d.name }));

    // Пауза и возврат меняют только статус: даты остаются в таблице как есть
    if ($('pause')) $('pause').onclick = () => changeStatus('pause');
    if ($('resume')) $('resume').onclick = () => changeStatus('active');

    function changeStatus(status) {
      run('saveEvent', {
        row: d.row, name: e.name, newName: e.name, status: status,
        start: saved.start, end: saved.end, term: saved.term, group: g.row
      });
    }
  }

  // Снять значения с экрана в черновик (перед перерисовкой)
  function sync() {
    if ($('nm')) d.name = $('nm').value.trim();
    if ($('st')) d.start = isoToYmd($('st').value);
    if ($('en')) d.end = isoToYmd($('en').value);
    if ($('tm')) d.term = $('tm').value.trim();
  }

  function save() {
    sync();
    if (!d.name) return say('Введите название');
    if (d.status === 'active' && d.term && !/^\d+\s*[mм]?$/i.test(d.term)) return say('Срок — число дней (45) или месяцев (2m)');
    const data = {
      newName: d.name,
      status: d.status,
      start: d.start,
      end: d.end,
      term: d.term,
      group: +$('gr').value
    };
    isNew ? run('addEvent', data) : run('saveEvent', Object.assign(data, { row: d.row, name: e.name }));
  }

  render();
}


// ====== Группа (g = null — новая) ======
function showGroup(g) {
  screen(`
    <div class="h">Название группы</div>
    <div class="c"><div class="r"><input id="gn" value="${g ? esc(g.name) : ''}" placeholder="Дом"></div></div>
    ${g ? `<div class="c gap">
      <div class="r tap link" id="ae">Добавить событие</div>
      ${g.items.length ? '' : '<div class="r tap danger" id="dg">Удалить группу</div>'}
    </div>` : ''}
  `, { main: [g ? 'Сохранить' : 'Создать', save], back: showList });

  if (g) {
    $('ae').onclick = () => showEvent(null, g);
    if (!g.items.length) $('dg').onclick = () => ask(`Удалить группу «${g.name}»?`, ok => ok && run('deleteGroup', { row: g.row, name: g.name }));
  }

  function save() {
    const name = $('gn').value.trim();
    if (!name) return say('Введите название');
    g ? run('renameGroup', { row: g.row, name: g.name, newName: name }) : run('addGroup', { newName: name });
  }
}


// ====== Демо ======
function demoApi(action) {
  if (action !== 'list') alert('Демо: изменения не сохраняются');
  const ev = (row, status, name, start, term, end, endYmd, days, endFormula) => ({
    row, status, statusText: status, name, start, startText: start, term, end, endYmd, days, endFormula: !!endFormula
  });
  return { ok: true, groups: [
    { row: 2, name: '🌱 Life', items: [
      ev(3, 'till', 'Зп', '', '', '2026-Nov-20', '20261120', -11, true),
      ev(4, 'count', 'Стрижка', '20261017', '', '', '', 23),
      ev(5, 'active', 'Тройка', '20261109', '29', '2026-Dec-08', '20261208', -29),
      ev(6, 'pause', 'Москвенок', '20260903', '29', '2026-Oct-02', '20261002', 38)
    ] },
    { row: 7, name: '🧸 Base', items: [
      ev(8, 'active', 'Мегафон', '20261018', '30', '2026-Nov-17', '20261117', -8),
      ev(9, 'active', 'TG Premium', '20260310', '12m', '2027-Mar-10', '20270310', -121),
      ev(10, 'active', 'YT Premium', '20261007', '3m', '2027-Jan-07', '20270107', -59),
      ev(11, 'active', 'Nordpass', '20250208', '24m', '2027-Feb-08', '20270208', -91)
    ] },
    { row: 20, name: '🏋️ Sport', items: [
      ev(21, 'count', 'Плечи', '20260501', '', '', '', 192),
      ev(22, 'count', 'Грудь', '20260501', '', '', '', 192)
    ] }
  ] };
}

load();
</script>
</body>
</html>
